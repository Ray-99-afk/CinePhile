<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePhile - Movies</title>
    <link rel="icon" href="mainlogo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --gold:#FFD700; --gold-dim:#b38b00; --gold-glow:rgba(255,215,0,.15);
            --bg:#0a0a0a; --surface:#111; --surface2:#1a1a1a;
            --text:#fff; --text-dim:#999; --nav-h:70px;
        }
        
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Roboto Condensed',sans-serif;overflow-x:hidden;min-height:100vh}
        body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9998;opacity:.4}

        nav{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 40px 0;background:transparent;backdrop-filter:none;border-bottom:none;z-index:1000;transition:transform .3s ease}
        nav.nav-hidden{transform:translateY(-100%)}
        .nav-left{display:flex;align-items:center;gap:20px}


        /* Logo = back to dashboard */
        .logo-link{text-decoration:none;color:#fff}
        .logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:4px;border:2px solid #fff;padding:3px 12px;transition:border-color .3s,color .3s}
        .logo-link:hover .logo{border-color:var(--gold);color:var(--gold)}
        .nav-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
        .nav-user-row{display:flex;align-items:center;gap:12px}
        .nav-username{font-family:'Poppins',sans-serif;font-size:.8rem;color:var(--text);letter-spacing:1px}
        .nav-logout{background:none;border:none;color:#ef4444;cursor:pointer;font-family:'Roboto Condensed',sans-serif;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;transition:opacity .3s}
        .nav-logout:hover{opacity:.8}
        .watchlist-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid rgba(255,215,0,.4);color:var(--gold);padding:4px 12px;cursor:pointer;font-family:'Roboto Condensed',sans-serif;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;transition:all .3s; border-radius:2px}
        .watchlist-btn:hover{background:var(--gold-glow);border-color:var(--gold)}
        .wl-count{background:var(--gold);color:#000;font-size:.65rem;font-weight:700;width:15px;height:15px;border-radius:50%;display:none;align-items:center;justify-content:center}
        .wl-count.visible{display:flex}

        .hero{padding:calc(var(--nav-h) + 40px) 40px 40px;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(255,215,0,.07) 0%,transparent 70%)}
        .hero-label{font-size:.75rem;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-bottom:16px;opacity:0;animation:fadeUp .6s .1s forwards}
        .hero-sub{font-family:'Poppins',sans-serif;font-size:.95rem;color:var(--text-dim);font-weight:300;opacity:0;animation:fadeUp .6s .2s forwards}
        .hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,8vw,7rem);letter-spacing:8px;line-height:.9;margin-bottom:40px;opacity:0;animation:fadeUp .6s .2s forwards}
        .hero h1 span{color:var(--gold)}
        .search-wrap{position:relative;flex:1;max-width:220px;margin:0 14px}
        .search-wrap input{width:100%;background:var(--surface);border:1px solid rgba(255,215,0,.2);border-radius:2px;padding:7px 32px 7px 12px;font-family:'Poppins',sans-serif;font-size:.78rem;color:var(--text);outline:none;transition:border-color .3s,box-shadow .3s}
        .search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,.08)}
        .search-wrap input::placeholder{color:var(--text-dim)}
        .search-icon{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:.95rem;pointer-events:none}

        /* Friends row inside nav */
        .friends-row{width:100%;display:flex;justify-content:center;gap:20px;padding:6px 0 8px}
        .friends-btn{position:relative;display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--text-dim);padding:4px 6px;cursor:pointer;font-family:'Roboto Condensed',sans-serif;font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;transition:color .3s}
        .friends-btn::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:2px;background:var(--gold);box-shadow:0 0 8px var(--gold),0 0 16px rgba(255,215,0,.5);border-radius:2px;transform:translateX(-50%);transition:width .3s ease}
        .friends-btn:hover{color:var(--gold)}
        .friends-btn:hover::after{width:100%}
        .friends-btn i{font-size:.95rem}


        .section{padding:60px 40px}
        .section-header{display:flex;align-items:center;gap:16px;margin-bottom:32px}
        .section-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:4px}
        .section-line{flex:1;height:1px;background:linear-gradient(to right,rgba(255,215,0,.3),transparent)}

        .movies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:18px}
        .movie-card{position:relative;aspect-ratio:2/3;overflow:hidden;cursor:pointer;background:var(--surface2);border:1px solid rgba(255,255,255,.05);transition:transform .4s cubic-bezier(.25,1,.5,1),border-color .3s;animation:fadeIn .4s both}
        .movie-card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,215,0,.4);z-index:10}
        .movie-card img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
        .movie-card:hover img{transform:scale(1.08)}
        .card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.3) 50%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;opacity:0;transition:opacity .3s}
        .movie-card:hover .card-overlay{opacity:1}
        .card-rating{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.8);border:1px solid var(--gold);color:var(--gold);padding:3px 7px;font-size:.72rem;font-weight:700;letter-spacing:1px}
        .card-wl-btn{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);color:#fff;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:1rem;border-radius:1px}
        .card-wl-btn:hover,.card-wl-btn.in-list{background:var(--gold);border-color:var(--gold);color:#000}
        .card-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;margin-bottom:4px}
        .card-meta{display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--text-dim);margin-bottom:8px}
        .card-genre{color:var(--gold);font-size:.68rem;letter-spacing:1px;text-transform:uppercase}
        .slider-container{margin-bottom:40px;}
        .slider-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:4px;margin-bottom:15px;display:flex;align-items:center;padding:0 40px;}
        .slider-title span{color:var(--gold);margin-right:10px;}
        .slider-row{display:flex;gap:18px;overflow-x:auto;padding:0 40px 20px 40px;scroll-behavior:smooth;}
        .slider-row::-webkit-scrollbar{height:6px}
        .slider-row::-webkit-scrollbar-track{background:var(--bg);border-radius:3px}
        .slider-row::-webkit-scrollbar-thumb{background:rgba(255,215,0,.3);border-radius:3px}
        .slider-row .movie-card{min-width:185px;max-width:185px;flex-shrink:0;}

        .play-btn{width:100%;background:var(--gold);color:#000;border:none;padding:7px;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .3s}
        .play-btn:hover{opacity:.85}

        /* Modal */
        .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9000;display:none;align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(8px)}
        .modal-backdrop.open{display:flex}
        .modal{width:100%;max-width:900px;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid rgba(255,215,0,.2);position:relative;animation:modalIn .3s ease;overflow:hidden;border-radius:6px;box-shadow:0 15px 40px rgba(0,0,0,0.6);}
        @keyframes modalIn{from{transform:scale(.95) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
        .modal-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;font-size:1.6rem;z-index:20;transition:all .3s}
        .modal-close:hover{background:var(--gold);color:#000;transform:rotate(90deg);}
        .modal-video{width:100%;height:35vh;min-height:220px;max-height:400px;background:#000;flex-shrink:0;}
        .modal-video iframe{width:100%;height:100%;border:none;}
        .modal-info{padding:26px;overflow-y:auto;flex:1;}
        .modal-info::-webkit-scrollbar{width:6px}
        .modal-info::-webkit-scrollbar-thumb{background:rgba(255,215,0,.3);border-radius:3px}
        .modal-title{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:3px;margin-bottom:10px;line-height:1.1}
        .modal-meta{display:flex;gap:12px;align-items:center;margin-bottom:14px;font-size:.85rem;color:var(--text-dim);flex-wrap:wrap;}
        .modal-meta .rating{color:var(--gold);font-weight:700;background:rgba(255,215,0,.1);padding:3px 8px;border-radius:3px;border:1px solid rgba(255,215,0,.2);}
        .modal-desc{font-family:'Poppins',sans-serif;font-size:.9rem;color:#ccc;line-height:1.6;margin-bottom:20px}
        .modal-actions{display:flex;gap:12px;width:100%;margin-top:10px}
        .modal-play-btn{display:flex;align-items:center;justify-content:center;flex:1;gap:8px;background:var(--gold);border:none;color:#000;padding:14px;cursor:pointer;font-family:'Roboto Condensed',sans-serif;font-size:1.05rem;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;transition:all .3s;border-radius:4px}
        .modal-play-btn:hover{background:#fff;box-shadow:0 0 20px rgba(255,255,255,.3);}
        .modal-wl-btn{display:flex;align-items:center;justify-content:center;flex:1;gap:8px;background:transparent;border:2px solid rgba(255,215,0,.4);color:var(--gold);padding:14px;cursor:pointer;font-family:'Roboto Condensed',sans-serif;font-size:.95rem;letter-spacing:1px;font-weight:700;text-transform:uppercase;transition:all .3s;border-radius:4px}
        .modal-wl-btn:hover,.modal-wl-btn.in-list{background:var(--gold);color:#000;border-color:var(--gold)}

        /* Watchlist panel */
        .wl-panel{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:var(--surface);border-left:1px solid rgba(255,215,0,.15);z-index:2000;transition:right .4s cubic-bezier(.25,1,.5,1);display:flex;flex-direction:column}
        .wl-panel.open{right:0}
        .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1999;display:none}
        .panel-overlay.open{display:block}
        .panel-hdr{padding:26px;border-bottom:1px solid rgba(255,215,0,.1);display:flex;align-items:center;justify-content:space-between}
        .panel-hdr h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px}
        .panel-close-btn{background:none;border:none;color:var(--text-dim);font-size:1.4rem;cursor:pointer;transition:color .3s}
        .panel-close-btn:hover{color:var(--gold)}
        .panel-list{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
        .panel-list::-webkit-scrollbar{width:4px}
        .panel-list::-webkit-scrollbar-thumb{background:rgba(255,215,0,.2);border-radius:2px}
        .panel-empty{text-align:center;color:var(--text-dim);font-family:'Poppins',sans-serif;padding:50px 20px}
        .panel-empty i{font-size:3rem;color:rgba(255,215,0,.2);margin-bottom:12px;display:block}
        .panel-item{display:flex;gap:12px;align-items:center;background:var(--surface2);padding:10px;border:1px solid rgba(255,255,255,.04);animation:fadeIn .3s}
        .panel-item img{width:46px;height:65px;object-fit:cover}
        .panel-item-info{flex:1}
        .panel-item-title{font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:2px;margin-bottom:3px}
        .panel-item-meta{font-size:.72rem;color:var(--text-dim)}
        .panel-item-rm{background:none;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer;transition:color .3s}
        .panel-item-rm:hover{color:#e50914}



        .no-results{text-align:center;padding:60px;color:var(--text-dim);display:none}
        .no-results.visible{display:block}
        .no-results i{font-size:3rem;margin-bottom:14px;display:block}

        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes spin{to{transform:rotate(360deg)}}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:rgba(255,215,0,.2)}

        @media(max-width:768px){
            nav{padding:0 16px}
            .hero{padding:calc(var(--nav-h)+30px) 16px 36px}
            .section{padding:36px 16px}
            .ai-prompt-wrap{flex-direction:column}
            .ai-submit-btn{width:100%;height:52px}
            .wl-panel{width:100%;right:-100%}
            .movies-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
        }
    
        /* Profile Panel */
        .profile-btn { display:flex; align-items:center; gap:10px; cursor:pointer; background:rgba(255,255,255,.05); padding:6px 14px 6px 6px; border-radius:30px; border:1px solid rgba(255,215,0,.3); transition:all .3s ease; margin-bottom: 8px;}
        .profile-btn:hover { background:rgba(255,215,0,.15); border-color:var(--gold); }
        .profile-avatar-sm { width:32px; height:32px; border-radius:50%; background:var(--gold); color:#000; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:1.1rem; }
        .profile-name-sm { font-family:'Poppins',sans-serif; font-size:.85rem; color:var(--text); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px; }

        .profile-panel { position:fixed; top:0; right:-400px; width:400px; height:100dvh; background:var(--surface); z-index:2000; transition:right .4s cubic-bezier(.25,1,.5,1); display:flex; flex-direction:column; box-shadow:-10px 0 30px rgba(0,0,0,.5); overflow-y:auto; overflow-x:hidden; }
        .profile-panel.open { right:0; }
        .profile-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1999; display:none; backdrop-filter:blur(3px); }
        .profile-overlay.open { display:block; }
        
        .profile-hdr { padding:30px; display:flex; align-items:center; justify-content:flex-end; }
        .profile-close-btn { background:none; border:none; color:var(--text-dim); font-size:1.8rem; cursor:pointer; transition:color .3s; }
        .profile-close-btn:hover { color:var(--danger); }
        
        .profile-body { padding:40px 30px; flex:1; display:flex; flex-direction:column; align-items:center; padding-top:0;}
        .profile-avatar-lg { width:100px; height:100px; border-radius:50%; background:var(--gold); color:#000; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:3.5rem; margin-bottom:20px; border:2px solid #fff; box-shadow:0 0 20px rgba(255,215,0,.3); margin-bottom:0; overflow:hidden;}
        
        .profile-input-group { width:100%; margin-bottom:20px; text-align:left;}
        .profile-input-group label { display:block; font-family:'Poppins',sans-serif; font-size:.75rem; color:var(--text-dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
        .profile-input { background:var(--surface2, #1c1c28); border:1px solid rgba(255,215,0,.3); color:#fff; padding:12px 20px; font-family:'Poppins',sans-serif; font-size:1rem; border-radius:4px; outline:none; width:100%; transition:all .3s; max-width: 100%; box-sizing: border-box;}
        
        .profile-footer { padding:20px 30px; border-top:1px solid rgba(255,255,255,.05); margin-top:auto;}
        
        .hidden { display:none !important; }
</style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="03_dashboard.html" class="logo-link"><div class="logo">CINEPHILE</div></a>
        </div>
        <div class="search-wrap">
            <input type="text" id="search-input" placeholder="Search movies, directors, actors…" autocomplete="off">
            <i class='bx bx-search search-icon'></i>
        </div>
        <div class="nav-right" style="display:flex; flex-direction: column; align-items: flex-end; gap: 5px;">
            <div class="profile-btn" onclick="toggleProfile()" style="padding:0; border:none; background:none; margin-bottom:0; cursor:pointer; transition:transform .3s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                <div class="profile-avatar-sm" id="nav-initial" style="width:28px; height:28px; font-size:1rem; border:1px solid rgba(255,215,0,.5); box-shadow:0 0 10px rgba(255,215,0,.2);">?</div>
            </div>
            <button class="watchlist-btn" onclick="toggleWL()" style="display:flex; align-items:center; gap:6px; background:none; border:1px solid rgba(255,215,0,.4); color:var(--gold); padding:4px 12px; cursor:pointer; font-family:'Roboto Condensed',sans-serif; font-size:.7rem; letter-spacing:1px; text-transform:uppercase; transition:all .3s; border-radius:2px;">
                <i class='bx bx-bookmark'></i> WATCHLIST
                <span class="wl-count" id="wl-count" style="background:var(--gold); color:#000; font-size:.6rem; font-weight:700; width:14px; height:14px; border-radius:50%; display:none; align-items:center; justify-content:center;">0</span>
            </button>
        </div>
        <div class="friends-row">
            <button class="friends-btn" onclick="alert('Friends list coming soon!')">
                <i class='bx bx-group'></i> Friends
            </button>
            <button class="friends-btn" onclick="alert('Add Friends coming soon!')">
                <i class='bx bx-user-plus'></i> Add Friends
            </button>
        </div>
    </nav>

    <div class="hero">
        <p class="hero-label">Cinema</p>
        <p class="hero-sub">Masterpieces, cult favourites, and everything in between.</p>
    </div>

    <div class="section" style="padding-top:0">
        <div id="sliders-container"></div>
        
        <h2 class="slider-title" id="more-title" style="margin-top:50px; padding-top:30px; border-top:1px solid rgba(255,255,255,0.05); justify-content:center;"><span>✦</span> MORE TO EXPLORE</h2>
        <div class="movies-grid" id="movies-grid" style="padding:40px;"></div>
        
        <div class="no-results" id="no-results">
            <i class='bx bx-camera-movie'></i>
            <p>No movies found.<br><span style="font-size:.85rem">Try a different search or filter.</span></p>
        </div>
    </div>

    <!-- Trailer Modal -->
    <div class="modal-backdrop" id="modal" onclick="handleModalBg(event)">
        <div class="modal" id="modal-box">
            <button class="modal-close" onclick="closeModal()" title="Close"><i class='bx bx-x'></i></button>
            <div class="modal-video"><iframe id="modal-iframe" allowfullscreen allow="autoplay"></iframe></div>
            <div class="modal-info">
                <h2 class="modal-title" id="modal-title"></h2>
                <div class="modal-meta">
                    <span class="rating" id="modal-rating"></span>
                    <span id="modal-year"></span>
                    <span id="modal-genre"></span>
                    <span id="modal-runtime"></span>
                </div>
                <p class="modal-desc" id="modal-desc"></p>
                <div class="modal-actions">
                    <button class="modal-play-btn" onclick="alert('Full movie streaming coming soon!')"><i class='bx bx-play-circle' style="font-size:1.4rem"></i> PLAY MOVIE</button>
                    <button class="modal-wl-btn" id="modal-wl-btn" onclick="wlFromModal()">
                        <i class='bx bx-bookmark-plus'></i> ADD TO WATCHLIST
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Watchlist Panel -->
    <div class="panel-overlay" id="panel-overlay" onclick="toggleWL()"></div>
    <div class="wl-panel" id="wl-panel">
        <div class="panel-hdr">
            <h2>MY WATCHLIST</h2>
            <button class="panel-close-btn" onclick="toggleWL()"><i class='bx bx-x'></i></button>
        </div>
        <div class="panel-list" id="panel-list"></div>
    </div>

    <!-- Profile Overlay & Panel -->
    <div class="profile-overlay" id="profile-overlay" onclick="toggleProfile()"></div>
    <div class="profile-panel" id="profile-panel" style="z-index:99999;">
        <div class="profile-hdr">
            <button class="profile-close-btn" onclick="toggleProfile()"><i class='bx bx-x'></i></button>
        </div>
        <div class="profile-body">
            <div style="position:relative; margin-bottom:30px;">
                <div class="profile-avatar-lg" id="profile-avatar-lg">?</div>
                <button onclick="changeAvatar()" style="position:absolute; bottom:0; right:0; background:var(--gold); border:none; color:#000; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 0 10px rgba(255,215,0,.5); font-size:1.2rem; transition:transform .3s; z-index: 2;">
                    <i class='bx bxs-camera'></i>
                </button>
            </div>
            
            <div class="profile-input-group">
                <label>Character Name</label>
                <input type="text" id="profile-name-input" class="profile-input" placeholder="Enter new name...">
            </div>
            
            <button id="btn-save-profile" class="hidden" style="width:100%; font-size:1rem; padding:10px; justify-content:center; display:flex; align-items:center; gap:6px; background:none; border:1px solid rgba(255,215,0,.4); color:var(--gold); cursor:pointer; font-family:'Roboto Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; transition:all .3s; border-radius:4px; margin-top:20px;" onclick="saveProfile()"><i class='bx bx-save'></i> SAVE CHANGES</button>
        </div>
        <div class="profile-footer">
            <button style="width:100%; border:1px solid var(--danger); background:none; color:var(--danger); font-size:1rem; padding:10px; justify-content:center; display:flex; align-items:center; gap:6px; cursor:pointer; font-family:'Roboto Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; transition:all .3s; border-radius:4px;" onclick="logout()">
                <i class='bx bx-log-out-circle'></i> LOGOUT
            </button>
        </div>
    </div>

    <script>
    const API_KEY = '52df95704200233ac0be06114624f980';
    const BASE = 'https://api.themoviedb.org/3';
    const IMG = 'https://image.tmdb.org/t/p/w500';

    let watchlist = JSON.parse(localStorage.getItem('cinephile_movies_wl') || '[]');
    let currentMovie = null;
    let allMovies = [];
    let searchTimeout = null;
    let isSearching = false;
    let page = 1;
    let totalPages = 1;
    let loadingMore = false;

    const CATEGORIES = [
        { id: 'awards', title: '<span>✦</span> OSCAR WINNERS & MASTERPIECES', url: '/discover/movie?sort_by=vote_average.desc&vote_count.gte=10000' },
        { id: 'anime', title: '<span>✦</span> ANIME', url: '/discover/movie?with_genres=16&with_original_language=ja' },
        { id: 'animation', title: '<span>✦</span> ANIMATION', url: '/discover/movie?with_genres=16' },
        { id: 'comedy', title: '<span>✦</span> COMEDY', url: '/discover/movie?with_genres=35' },
        { id: 'drama', title: '<span>✦</span> EMOTIONAL DRAMA', url: '/discover/movie?with_genres=18' },
        { id: 'scifi', title: '<span>✦</span> SCI-FI', url: '/discover/movie?with_genres=878' },
        { id: '90s', title: '<span>✦</span> 90s THROWBACK', url: '/discover/movie?primary_release_date.gte=1990-01-01&primary_release_date.lte=1999-12-31' }
    ];

    const GENRES = {};
    fetch(`${BASE}/genre/movie/list?api_key=${API_KEY}`).then(r=>r.json()).then(d=>{
        d.genres.forEach(g=>GENRES[g.id]=g.name);
        loadCategories();
    });
    updateWLCount();

    async function loadCategories() {
        const container = document.getElementById('sliders-container');
        container.innerHTML = CATEGORIES.map(cat => `
            <div class="slider-container" id="slider-${cat.id}">
                <h2 class="slider-title">${cat.title}</h2>
                <div class="slider-row" id="row-${cat.id}"></div>
            </div>
        `).join('');

        for (const cat of CATEGORIES) {
            try {
                const res = await fetch(`${BASE}${cat.url}&api_key=${API_KEY}`);
                const data = await res.json();
                const movies = data.results.filter(m=>m.poster_path).map(mapMovie);
                movies.forEach(m => { if(!allMovies.find(x=>x.id===m.id)) allMovies.push(m); });
                document.getElementById(`row-${cat.id}`).innerHTML = movies.map((m,i)=>buildCard(m,i)).join('');
            } catch(e) { console.error(e); }
        }
        loadMore();
    }

    async function loadMore() {
        if (loadingMore || page > totalPages || isSearching) return;
        loadingMore = true;
        try {
            const res = await fetch(`${BASE}/movie/popular?api_key=${API_KEY}&page=${page}`);
            const data = await res.json();
            totalPages = Math.min(data.total_pages, 20);
            const movies = data.results.filter(m=>m.poster_path).map(mapMovie);
            movies.forEach(m => { if(!allMovies.find(x=>x.id===m.id)) allMovies.push(m); });
            document.getElementById('movies-grid').innerHTML += movies.map((m,i) => buildCard(m,i)).join('');
            page++;
        } catch(e) { console.error('TMDB error:', e); }
        loadingMore = false;
    }

    function mapMovie(m) {
        const genreNames = (m.genre_ids||[]).map(id=>GENRES[id]||'').filter(Boolean);
        return {
            id: m.id,
            title: m.title || m.original_title,
            year: (m.release_date||'').split('-')[0] || '—',
            genre: genreNames[0] || '—',
            rating: (m.vote_average||0).toFixed(1),
            runtime: '',
            poster: m.poster_path ? IMG + m.poster_path : '',
            desc: m.overview || 'No description available.'
        };
    }

    function renderGrid(movies) {
        const grid = document.getElementById('movies-grid');
        const noRes = document.getElementById('no-results');
        if (!movies.length) { grid.innerHTML=''; noRes.classList.add('visible'); return; }
        noRes.classList.remove('visible');
        grid.innerHTML = movies.map((m,i) => buildCard(m,i)).join('');
    }

    function buildCard(m, i) {
        const inList = watchlist.find(w=>w.id===m.id);
        return `<div class="movie-card" style="animation-delay:${(i%20)*0.04}s" onclick="openModal(${m.id})">
            <img src="${m.poster}" alt="${m.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/185x275/1a1a1a/FFD700?text=${encodeURIComponent(m.title)}'">
            <div class="card-rating">★ ${m.rating}</div>
            <button class="card-wl-btn ${inList?'in-list':''}" onclick="event.stopPropagation();quickWL(${m.id})" title="Watchlist">
                <i class='bx ${inList?'bxs-bookmark':'bx-bookmark-plus'}'></i>
            </button>
            <div class="card-overlay">
                <span class="card-genre">${m.genre}</span>
                <h3 class="card-title">${m.title}</h3>
                <div class="card-meta"><span>${m.year}</span></div>
                <button class="play-btn"><i class='bx bx-show'></i> VIEW DETAILS</button>
            </div>
        </div>`;
    }

    document.getElementById('search-input').addEventListener('input', e => {
        clearTimeout(searchTimeout);
        const q = e.target.value.trim();
        if (!q) {
            isSearching = false;
            document.getElementById('sliders-container').style.display = 'block';
            document.getElementById('more-title').style.display = 'flex';
            document.getElementById('movies-grid').innerHTML = '';
            document.getElementById('no-results').classList.remove('visible');
            page = 1;
            loadMore();
            return;
        }
        document.getElementById('sliders-container').style.display = 'none';
        document.getElementById('more-title').style.display = 'none';
        searchTimeout = setTimeout(async () => {
            isSearching = true;
            try {
                const res = await fetch(`${BASE}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(q)}&page=1`);
                const data = await res.json();
                const movies = data.results.filter(m=>m.poster_path).map(mapMovie);
                allMovies = movies;
                renderGrid(movies);
            } catch(e) { console.error(e); }
        }, 400);
    });

    window.addEventListener('scroll', () => {
        if (isSearching) return;
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) loadMore();
    });

    async function openModal(id) {
        let m = allMovies.find(x=>x.id===id);
        if (!m) {
            try {
                const res = await fetch(`${BASE}/movie/${id}?api_key=${API_KEY}`);
                const d = await res.json();
                m = { id:d.id, title:d.title, year:(d.release_date||'').split('-')[0],
                    genre:d.genres?.[0]?.name||'—', rating:(d.vote_average||0).toFixed(1),
                    runtime:d.runtime?`${Math.floor(d.runtime/60)}h ${d.runtime%60}m`:'',
                    poster:d.poster_path?IMG+d.poster_path:'', desc:d.overview||'' };
            } catch(e) { return; }
        }
        currentMovie = m;
        if (!m.runtime) {
            try {
                const d = await (await fetch(`${BASE}/movie/${id}?api_key=${API_KEY}`)).json();
                m.runtime = d.runtime ? `${Math.floor(d.runtime/60)}h ${d.runtime%60}m` : '';
            } catch(e) {}
        }
        document.getElementById('modal-title').textContent = m.title;
        document.getElementById('modal-rating').textContent = `★ ${m.rating}`;
        document.getElementById('modal-year').textContent = m.year;
        document.getElementById('modal-genre').textContent = m.genre;
        document.getElementById('modal-runtime').textContent = m.runtime;
        document.getElementById('modal-desc').textContent = m.desc;
        document.getElementById('modal-iframe').src = '';
        try {
            const vData = await (await fetch(`${BASE}/movie/${id}/videos?api_key=${API_KEY}`)).json();
            const t = vData.results.find(v=>v.type==='Trailer'&&v.site==='YouTube') || vData.results[0];
            if (t) document.getElementById('modal-iframe').src = `https://www.youtube.com/embed/${t.key}?autoplay=1&playsinline=1&fs=1&rel=0`;
        } catch(e) {}
        const inList = watchlist.find(w=>w.id===m.id);
        const btn = document.getElementById('modal-wl-btn');
        btn.className = `modal-wl-btn ${inList?'in-list':''}`;
        btn.innerHTML = `<i class='bx ${inList?'bxs-bookmark':'bx-bookmark-plus'}'></i> ${inList?'IN WATCHLIST':'ADD TO WATCHLIST'}`;
        document.getElementById('modal').classList.add('open');
        document.body.style.overflow='hidden';
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('modal-iframe').src=''; document.body.style.overflow=''; currentMovie=null; }
    function handleModalBg(e) { if(e.target===document.getElementById('modal')) closeModal(); }

    function quickWL(id) { const m=allMovies.find(x=>x.id===id); if(!m) return; toggleWLItem(m); renderGrid(allMovies); }
    function wlFromModal() { if(!currentMovie) return; toggleWLItem(currentMovie); openModal(currentMovie.id); }
    function toggleWLItem(m) {
        const idx=watchlist.findIndex(w=>w.id===m.id);
        if(idx>=0) watchlist.splice(idx,1); else watchlist.push(m);
        localStorage.setItem('cinephile_movies_wl',JSON.stringify(watchlist));
        updateWLCount(); renderWLPanel();
    }
    function updateWLCount() { 
        const mWL = JSON.parse(localStorage.getItem('cinephile_movies_wl') || '[]');
        const sWL = JSON.parse(localStorage.getItem('cinephile_series_wl') || '[]');
        const total = mWL.length + sWL.length;
        const el = document.getElementById('wl-count'); 
        el.textContent = total; 
        total > 0 ? el.classList.add('visible') : el.classList.remove('visible'); 
    }
    function toggleWL() { document.getElementById('wl-panel').classList.toggle('open'); document.getElementById('panel-overlay').classList.toggle('open'); renderWLPanel(); }
    function renderWLPanel() {
        const list = document.getElementById('panel-list');
        const mWL = JSON.parse(localStorage.getItem('cinephile_movies_wl') || '[]');
        const sWL = JSON.parse(localStorage.getItem('cinephile_series_wl') || '[]');
        const all = [...mWL.map(m=>({...m, _t:'MOVIE'})), ...sWL.map(s=>({...s, _t:'SERIES'}))];
        if(!all.length){ list.innerHTML=`<div class="panel-empty"><i class='bx bx-bookmark'></i><p>Your watchlist is empty.</p></div>`; return; }
        list.innerHTML=all.map(item=>`<div class="panel-item" onclick="handleWlClick(${item.id}, '${item._t}')" style="cursor:pointer;"><img src="${item.poster}" alt="${item.title}"><div class="panel-item-info"><div class="panel-item-title" style="display:flex;align-items:center;gap:6px;">${item.title} <span style="font-size:0.6rem;padding:2px 4px;background:var(--gold);color:#000;border-radius:2px;letter-spacing:1px;line-height:1;">${item._t}</span></div><div class="panel-item-meta">${item.year} · ${item.genre} · ★ ${item.rating}</div></div><button class="panel-item-rm" onclick="event.stopPropagation(); rmFromPanel(${item.id}, '${item._t}')" title="Remove"><i class='bx bx-x'></i></button></div>`).join('');
    }
    function handleWlClick(id, type) {
        if (type === 'MOVIE') { openModal(id); toggleWL(); } 
        else { window.location.href = `05_series.html?id=${id}`; }
    }
    function rmFromPanel(id, type) { 
        if (type === 'MOVIE') {
            watchlist = watchlist.filter(w=>w.id!==id); 
            localStorage.setItem('cinephile_movies_wl',JSON.stringify(watchlist)); 
            renderGrid(allMovies); 
        } else {
            let sWL = JSON.parse(localStorage.getItem('cinephile_series_wl') || '[]');
            sWL = sWL.filter(w=>w.id!==id);
            localStorage.setItem('cinephile_series_wl',JSON.stringify(sWL));
        }
        updateWLCount(); renderWLPanel(); 
    }

    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
    let lastScroll=0;
    window.addEventListener('scroll',()=>{ const cur=window.scrollY; document.querySelector('nav').classList.toggle('nav-hidden',cur>lastScroll&&cur>80); lastScroll=cur; });

    
    let meName = localStorage.getItem('cinephile_user_name') || 'PLAYER';
    let currentAvatarUrl = localStorage.getItem('cinephile_avatar') || '';

    function getLoadName() {
        meName = localStorage.getItem('cinephile_user_name') || 'PLAYER';
        currentAvatarUrl = localStorage.getItem('cinephile_avatar') || '';
        
        if(document.getElementById('nav-username')) document.getElementById('nav-username').textContent = meName;
        if(document.getElementById('profile-name-input')) document.getElementById('profile-name-input').value = meName;
        
        if(document.getElementById('nav-initial') && document.getElementById('profile-avatar-lg')) {
            if (currentAvatarUrl) {
                document.getElementById('nav-initial').innerHTML = `<img src="${currentAvatarUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                document.getElementById('profile-avatar-lg').innerHTML = `<img src="${currentAvatarUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            } else {
                document.getElementById('nav-initial').textContent = meName.charAt(0).toUpperCase();
                document.getElementById('profile-avatar-lg').textContent = meName.charAt(0).toUpperCase();
            }
        }
    }

    function changeAvatar() {
        const url = prompt("Enter an Image URL for your new avatar:", currentAvatarUrl);
        if (url !== null) {
            localStorage.setItem('cinephile_avatar', url.trim());
            const btn = document.getElementById('btn-save-profile');
            if(btn) btn.classList.remove('hidden');
            getLoadName();
        }
    }

    function toggleProfile() {
        document.getElementById('profile-panel').classList.toggle('open');
        document.getElementById('profile-overlay').classList.toggle('open');
        getLoadName();
        const btn = document.getElementById('btn-save-profile');
        if(btn) btn.classList.add('hidden');
    }

    async function saveProfile() {
        const newName = document.getElementById('profile-name-input').value.trim();
        const avatarUrl = localStorage.getItem('cinephile_avatar') || '';
        
        if(!newName) { alert("Name cannot be empty!"); return; }
        
        localStorage.setItem('cinephile_user_name', newName); 
        getLoadName(); 

        if(window.fbUpdateProfile) {
            await window.fbUpdateProfile(newName, avatarUrl);
        }
        document.getElementById('btn-save-profile').classList.add('hidden');
        toggleProfile();
    }

    function logout() { localStorage.removeItem("cinephile_user_name"); window.location.href="02_login.html"; }

    document.addEventListener('DOMContentLoaded', () => {
        getLoadName();
        const input = document.getElementById('profile-name-input');
        if(input) {
            input.addEventListener('input', () => {
                const btn = document.getElementById('btn-save-profile');
                if (input.value.trim() !== meName) {
                    btn.classList.remove('hidden');
                } else {
                    btn.classList.add('hidden');
                }
            });
        }
    });


    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id');
    if (targetId) { setTimeout(() => openModal(Number(targetId)), 300); }
    </script>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, updateProfile } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyA81Gb34RwpjVU1w3l5eAxktd3BribOJzo",
            authDomain: "cinephile-binge.firebaseapp.com",
            projectId: "cinephile-binge"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.fbUpdateProfile = async (newName, newPhotoUrl) => {
            if(!auth || !auth.currentUser) return false;
            try {
                await updateProfile(auth.currentUser, { displayName: newName, photoURL: newPhotoUrl || "" });
                return true;
            } catch (e) { return false; }
        };
    </script>

</body>

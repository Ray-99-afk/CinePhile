<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePhile - Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <section id="auth-section">
        <div class="auth-container" id="auth-container">
            
            <a href="01_index.html" class="back-btn">
                <i class='bx bx-arrow-back'></i> Back
            </a>

            <div class="auth-form-container sign-up">
                <form class="auth-form">
                    <h1>Create Script</h1>
                    <div class="auth-social-icons">
                        <a href="#" class="auth-icon"><i class='bx bxl-google'></i></a>
                        <a href="#" class="auth-icon"><i class='bx bxl-github'></i></a>
                    </div>
                    <span>or use your email for registration</span>
                    <div class="auth-input-box">
                        <input type="text" placeholder="Character Name">
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="auth-input-box">
                        <input type="email" placeholder="Email">
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="auth-input-box">
                        <input type="password" placeholder="Password">
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button class="auth-btn">Sign Up</button>
                </form>
            </div>

            <div class="auth-form-container sign-in">
                <form class="auth-form">
                    <h1>Resume Action</h1>
                    <div class="auth-social-icons">
                        <a href="#" class="auth-icon"><i class='bx bxl-google'></i></a>
                        <a href="#" class="auth-icon"><i class='bx bxl-github'></i></a>
                    </div>
                    <span>or use your email password</span>
                    <div class="auth-input-box">
                        <input type="email" placeholder="Email">
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="auth-input-box">
                        <input type="password" placeholder="Password">
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <a href="#" class="forget-pass">Forget Your Password?</a>
                    <button class="auth-btn">Login</button>
                </form>
            </div>

            <div class="auth-toggle-container">
                <div class="auth-toggle">
                    <div class="auth-toggle-panel auth-toggle-left">
                        <h1>Welcome Back!</h1>
                        <p>Enter your personal details to resume your journey.</p>
                        <button class="auth-btn transparent" id="login">Login</button>
                    </div>
                    <div class="auth-toggle-panel auth-toggle-right">
                        <h1>Hello, Friend!</h1>
                        <p>Register with your personal details to start your scene.</p>
                        <button class="auth-btn transparent" id="register">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
